[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aml_system"
version = "0.0.1"
description = "AML system for detecting money mules."
authors = [
  { name = "bjn_blt" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "loguru",
    "matplotlib>=3.10.8",
    "mkdocs",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["aml_system"]
include = ["pyproject.toml", "aml_system/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aml_system"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "ruff>=0.15.9",
]

